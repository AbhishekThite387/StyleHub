services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stylehub-backend
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    networks:
      - stylehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: stylehub-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - stylehub-network

  admin:
    build:
      context: ./styleHub_admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: stylehub-admin
    ports:
      - "3001:80"
    restart: unless-stopped
    networks:
      - stylehub-network

networks:
  stylehub-network:
    driver: bridge